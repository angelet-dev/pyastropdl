[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyastropdl"
version = "0.9.0"
description = "Powered Descent and Landing Solver (Lunar Edition)"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "@angelet-dev" }
]
dependencies = [
    "numpy>=1.24.0",
    "matplotlib>=3.5.0",
    "numba>=0.57.0"
]

[project.urls]
"Homepage" = "https://github.com/angelet-dev/pyastropdl"
"Repository" = "https://github.com/angelet-dev/pyastropdl"

[tool.setuptools.packages.find]
where = ["."]
include = ["pyastropdl*"]

[tool.setuptools.package-data]
"pyastropdl" = [
    "visualization/style/fonts/Geist/static/*.ttf",
    "**/*.ttf"
]